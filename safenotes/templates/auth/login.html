{% extends "base.html" %}
{% from "_macros.html" import csrf_field %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  {% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('auth.login') }}" class="form">
    {{ csrf_field() }}
    <input type="hidden" name="next" value="{{ next_url }}">
    <label>Username
      <input name="username" value="{{ username }}" autocomplete="username" required maxlength="64" autofocus>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required maxlength="256">
    </label>
    <button type="submit" class="primary">Sign in</button>
  </form>
  <p class="muted">No account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
</section>
{% endblock %}
